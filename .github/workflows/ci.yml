name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: shellcheck installer and configure scripts
        run: |
          shellcheck -s bash install.sh git_setup.sh
          # configure.sh files are sourced by install.sh, which defines $DRY_RUN and friends
          shellcheck -s bash -e SC2154 */configure.sh

      - name: No duplicate aliases or functions
        run: .github/scripts/check-duplicates.sh

      - name: zsh syntax
        run: |
          for f in shell/zsh/.zshrc shell/zsh/.zshenv shell/zsh/.zprofile shell/zsh/home.zshenv \
                   shell/alias.sh shell/functions.sh git/funcs.sh */*.rc.sh */*.env.sh; do
            zsh -n "$f" || { echo "::error file=$f::zsh syntax error"; exit 1; }
          done

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Brewfile parses
        run: |
          brew bundle list --all --file=brew/Brewfile
          brew bundle list --all --file=brew/Brewfile.pro

      # every step uses a throwaway home, so the runner's own dotfiles are never touched
      - name: Dry run
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          HOME="$RUNNER_TEMP/home" SHELL=/bin/zsh ./install.sh --dry-run

      - name: Install (without Homebrew packages)
        run: HOME="$RUNNER_TEMP/home" SHELL=/bin/zsh ./install.sh --skip-brew

      - name: Second run changes nothing
        run: |
          HOME="$RUNNER_TEMP/home" SHELL=/bin/zsh ./install.sh --skip-brew | tee second-run.log
          if grep -E 'Linking|Moving|Copying' second-run.log; then
            echo "::error::second run changed files"; exit 1
          fi

      - name: zsh starts
        run: |
          HOME="$RUNNER_TEMP/home" zsh -l -i -c 'echo "ZDOTDIR=$ZDOTDIR"; echo "DOTFILES=$DOTFILES"; (( $+functions[omz] )) || exit 1'
