# gpg settings, linked to ~/.gnupg/gpg.conf by gpg/configure.sh (only when there was no gpg.conf yet).
# Safe subset of the hardened settings in drduh's YubiKey-Guide; none of them changes how git signs.
# Options: https://www.gnupg.org/documentation/manuals/gnupg/GPG-Options.html

# Preferred algorithms when encrypting/signing, strongest first
personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
# Preferences written into keys created from now on (what others should use to encrypt to you)
default-preference-list SHA512 SHA384 SHA256 AES256 AES192 AES ZLIB BZIP2 ZIP Uncompressed
# Hash used when signing other people's keys
cert-digest-algo SHA512
# Password-based (gpg -c) encryption and key protection: stronger hash and cipher
s2k-digest-algo SHA512
s2k-cipher-algo AES256
# Don't keep the passphrase of gpg -c in the agent's cache
no-symkey-cache

# Refuse subkeys that aren't cross-certified by their main key (protects against a known attack)
require-cross-certification

# Output: no "Comment:"/"Version:" lines in armored text, no copyright banner
charset utf-8
no-comments
no-emit-version
no-greeting

# Show long key IDs (16 hex digits; short 8-digit IDs can be faked) and full fingerprints
keyid-format 0xlong
with-fingerprint
# Show how much each name (UID) on a key is trusted when listing keys and checking signatures
list-options show-uid-validity
verify-options show-uid-validity

# Left out on purpose:
#   armor          every encrypted file would be text, not binary
#   throw-keyids   hides recipients, breaks some mail tools
#   require-secmem gpg refuses to run when it can't lock memory
#   use-agent      obsolete since gpg 2 (the agent is always used)
