# gpg-agent settings, linked to ~/.gnupg/gpg-agent.conf by gpg/configure.sh.
# After changing this file: gpgconf --kill gpg-agent (it restarts on the next gpg call)

# Ask for the passphrase in a macOS dialog (can save it in the Keychain) instead of the terminal,
# so signing also works from VS Code and other GUI apps. Path of brew "pinentry-mac" on Apple Silicon.
pinentry-program /opt/homebrew/bin/pinentry-mac
