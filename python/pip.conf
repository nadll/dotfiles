# pip user settings, linked by python/configure.sh to ~/.config/pip/pip.conf
# (and to ~/Library/Application Support/pip/pip.conf when that folder exists, which pip then prefers)
# https://pip.pypa.io/en/stable/topics/configuration/

[install]
# Supply-chain cooldown: ignore package versions uploaded less than 7 days ago (ISO 8601 duration).
# Needs pip 26.1+. One-off bypass: pip install --uploaded-prior-to P0D ...
uploaded-prior-to = P7D
